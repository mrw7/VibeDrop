# VibeDrop Nginx reverse proxy config
# Terminates TLS (Let's Encrypt) and proxies to the Next.js app container.
#
# Replace ${DOMAIN} via envsubst at container start (see docker-compose.prod.yml).

# Rate-limit static assets / API to protect the app container
limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;

upstream vibedrop_app {
  server app:3000;
}

# HTTP → HTTPS redirect + ACME challenge passthrough
server {
  listen 80;
  server_name ${DOMAIN};

  # Let's Encrypt ACME challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Everything else → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS reverse proxy
server {
  listen 443 ssl http2;
  server_name ${DOMAIN};

  # TLS certs (managed by certbot)
  ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

  # Modern TLS config
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Security headers (Next.js also sets some; these are belt-and-suspenders)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  client_max_body_size 110M;  # Allow ZIP uploads (100MB limit + headroom)

  location / {
    proxy_pass http://vibedrop_app;
    proxy_http_version 1.1;

    # WebSocket + keep-alive support (NextAuth, editor)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Timeouts for long-running builds/uploads
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
